<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>计算器 · 工具箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #8e8e93;
    --accent: #007aff;
    --key: #ffffff;
    --key-border: #e5e5ea;
    --key-fn: #e9e9ee;
    --key-op: #007aff;
    --key-op-text: #ffffff;
    --key-eq: #34c759;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 4px;
  }
  .topbar a {
    color: var(--accent); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .display {
    margin: 20px 20px 12px;
    background: var(--card);
    border: 1px solid var(--key-border);
    border-radius: 16px;
    padding: 18px 16px;
    text-align: right;
    min-height: 96px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .display .expr {
    font-size: 15px; color: var(--sub);
    min-height: 20px; word-break: break-all;
  }
  .display .result {
    font-size: 36px; font-weight: 600; line-height: 1.2;
    word-break: break-all;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 4px 20px 24px;
    max-width: 480px; width: 100%; margin: 0 auto;
    flex: 1;
  }
  .keys button {
    border: 1px solid var(--key-border);
    background: var(--key);
    border-radius: 14px;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    padding: 16px 0;
    cursor: pointer;
    font-family: inherit;
    transition: transform .08s ease, background .08s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .keys button:active { transform: scale(.96); background: #f2f2f7; }
  .keys button.fn { background: var(--key-fn); font-size: 19px; }
  .keys button.op { background: var(--key-op); color: var(--key-op-text); border-color: var(--key-op); }
  .keys button.op:active { background: #0062cc; }
  .keys button.eq { background: var(--key-eq); color: #fff; border-color: var(--key-eq); }
  .keys button.eq:active { background: #28a745; }
  .keys button.wide { grid-column: span 2; }

/* HARDCORE TERMINAL THEME */
:root{color-scheme:dark;--bg:#0a0a0c;--panel:#111318;--line:#26312c;--green:#00ff66;--amber:#ffbd4a;--cyan:#47dfff;--muted:#82908a}html,body{background:#0a0a0c!important;color:#d9e5dd!important;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace!important}body{background-image:repeating-linear-gradient(0deg,rgba(0,255,102,.018) 0px,rgba(0,255,102,.018) 1px,transparent 1px,transparent 3px)!important}a{color:#00ff66!important}h1,h2,h3{color:#00ff66!important;letter-spacing:.025em}.card,.display,.result-box,.panel,.container{background:#111318!important;border:1px solid #26312c!important;border-radius:4px!important;box-shadow:0 0 18px rgba(0,255,102,.055)}label,.sub,.hint,.muted{color:#93a49a!important}input,select,textarea{background:#090b0a!important;color:#d9e5dd!important;border:1px solid #34443a!important;border-radius:3px!important;font-family:inherit!important}input:focus,select:focus,textarea:focus{border-color:#00ff66!important;box-shadow:0 0 0 2px rgba(0,255,102,.15)!important}.btn,button{background:#151a17!important;color:#00ff66!important;border:1px solid #00a944!important;border-radius:3px!important;font-family:inherit!important;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 3px 0 #071009!important}.btn.p,.btn.primary{background:#00ff66!important;color:#061009!important;border-color:#00ff66!important}.btn:active,button:active{transform:translateY(2px);box-shadow:0 1px 0 #071009!important}.tag,.badge{color:#ffbd4a!important}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html">‹ 工具箱</a>
  <h1>计算器</h1>
</div>

<div class="display">
  <div class="expr" id="expr"></div>
  <div class="result" id="result">0</div>
</div>

<div class="keys">
  <button class="fn" data-act="clear">C</button>
  <button class="fn" data-act="back">⌫</button>
  <button class="fn" data-act="pct">%</button>
  <button class="op" data-act="op" data-val="÷">÷</button>

  <button data-act="num" data-val="7">7</button>
  <button data-act="num" data-val="8">8</button>
  <button data-act="num" data-val="9">9</button>
  <button class="op" data-act="op" data-val="×">×</button>

  <button data-act="num" data-val="4">4</button>
  <button data-act="num" data-val="5">5</button>
  <button data-act="num" data-val="6">6</button>
  <button class="op" data-act="op" data-val="−">−</button>

  <button data-act="num" data-val="1">1</button>
  <button data-act="num" data-val="2">2</button>
  <button data-act="num" data-val="3">3</button>
  <button class="op" data-act="op" data-val="+">+</button>

  <button class="wide" data-act="num" data-val="0">0</button>
  <button data-act="num" data-val=".">.</button>
  <button class="eq" data-act="eq">=</button>
</div>

<script>
(function () {
  var exprEl = document.getElementById('expr');
  var resultEl = document.getElementById('result');
  var current = '0';
  var previous = null;
  var operator = null;
  var justEq = false;

  function fmt(n) {
    if (!isFinite(n)) return '错误';
    var s = String(Math.round(n * 1e12) / 1e12);
    return s;
  }
  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    if (op === '+') return a + b;
    if (op === '−') return a - b;
    if (op === '×') return a * b;
    if (op === '÷') return b === 0 ? NaN : a / b;
    return b;
  }
  function render() {
    var expr = '';
    if (previous !== null) {
      expr = previous + ' ' + (operator || '');
      if (operator && !justEq) expr += ' ' + (current === '0' && operator ? '' : current);
      if (justEq) expr += ' ' + current + ' =';
    }
    exprEl.textContent = expr;
    resultEl.textContent = current;
  }
  function inputNum(v) {
    if (justEq) { current = '0'; previous = null; operator = null; justEq = false; }
    if (v === '.') {
      if (current.indexOf('.') === -1) current += '.';
    } else {
      if (current === '0') current = v;
      else if (current.replace('-', '').replace('.', '').length < 12) current += v;
    }
    render();
  }
  function inputOp(op) {
    if (operator !== null && previous !== null && !justEq) {
      var r = compute(previous, current, operator);
      current = fmt(r); previous = null;
    }
    if (current === '错误') return;
    previous = current;
    operator = op;
    current = '0';
    justEq = false;
    render();
  }
  function equals() {
    if (operator === null || previous === null) return;
    var r = compute(previous, current, operator);
    var expr = previous + ' ' + operator + ' ' + current + ' =';
    current = fmt(r);
    exprEl.textContent = expr;
    resultEl.textContent = current;
    previous = null; operator = null; justEq = true;
  }
  function clearAll() {
    current = '0'; previous = null; operator = null; justEq = false;
    render();
  }
  function backspace() {
    if (justEq) { clearAll(); return; }
    if (current.length > 1) current = current.slice(0, -1);
    else current = '0';
    render();
  }
  function percent() {
    var n = parseFloat(current);
    if (isNaN(n)) return;
    current = fmt(n / 100);
    render();
  }

  document.querySelectorAll('.keys button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var act = btn.getAttribute('data-act');
      var val = btn.getAttribute('data-val');
      if (act === 'num') inputNum(val);
      else if (act === 'op') inputOp(val);
      else if (act === 'eq') equals();
      else if (act === 'clear') clearAll();
      else if (act === 'back') backspace();
      else if (act === 'pct') percent();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (/^[0-9.]$/.test(e.key)) inputNum(e.key);
    else if (e.key === '+' || e.key === '-') inputOp(e.key === '-' ? '−' : '+');
    else if (e.key === '*') inputOp('×');
    else if (e.key === '/') { e.preventDefault(); inputOp('÷'); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') percent();
  });

  render();
})();
</script>
</body>
</html>
