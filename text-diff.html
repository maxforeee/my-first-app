<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文本对比</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;color:#1c1c1e;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:28px;margin:8px 0 4px;font-weight:700}
.sub{color:#8e8e93;margin:0 0 22px;font-size:15px}
.card{background:#fff;border:1px solid #e5e5ea;border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:14px;color:#8e8e93;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:17px;color:#1c1c1e;background:#fff;border:1px solid #e5e5ea;border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
textarea{min-height:150px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:#007aff;box-shadow:0 0 0 3px #e5f0ff}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;accent-color:#007aff}
input[type=range]{padding:0;min-height:36px;accent-color:#007aff;border:0;box-shadow:none}
.btn{font:inherit;font-size:17px;font-weight:600;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid #e5e5ea;background:#fff;color:#007aff;cursor:pointer}
.btn.p{background:#007aff;border-color:#007aff;color:#fff}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;flex:none}
.btn:active{opacity:.7}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #b3d4ff;outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid #e5e5ea;background:#fff;font:inherit;font-size:15px;color:#1c1c1e;cursor:pointer}
.chip.on{background:#e5f0ff;border-color:#007aff;color:#007aff;font-weight:600}
.msg{border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px;word-break:break-word}
.msg.err{background:#ffe9e8;color:#d70015}
.msg.ok{background:#e8f8ec;color:#1e7d35}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid #e5e5ea;font-size:17px}
.opt:last-child{border-bottom:0}
.res{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e5e5ea}
.res:last-child{border-bottom:0}
.res .k{color:#8e8e93;font-size:14px;width:76px;flex:none}
.res .v{flex:1;font-size:17px;word-break:break-all;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  if(btn){const o=btn.dataset.o||btn.textContent;btn.dataset.o=o;btn.textContent='已复制';clearTimeout(btn._t);btn._t=setTimeout(()=>btn.textContent=o,1200)}
}
</script>
</head>
<body>
<style>
.dl{padding:3px 10px;white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;min-height:24px}
.dl.del{background:#ffe5e5}.dl.add{background:#e3f7e8}.dl.empty{background:#f2f2f7}
mark{color:inherit;border-radius:3px}mark.d{background:#ff9f9f}mark.a{background:#8fe0a4}
.sbs{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5e5ea;border-radius:12px;overflow:hidden}
.sbs>.dl:nth-child(odd){border-right:1px solid #e5e5ea}
.uni{border:1px solid #e5e5ea;border-radius:12px;overflow:hidden}
</style>
<div class="wrap">
<h1>文本对比</h1>
<p class="sub">放入两段文字，标出新增、删除和修改的地方</p>
<div class="card">
  <label for="ta">原文</label><textarea id="ta" spellcheck="false"></textarea>
  <label for="tb" style="margin-top:14px">修改后</label><textarea id="tb" spellcheck="false"></textarea>
  <div class="row" style="margin-top:14px"><button class="btn p" id="go">对比</button><button class="btn" id="clr">清除</button></div>
</div>
<div class="card" id="resCard" hidden>
  <div class="chips" id="views" style="margin-bottom:10px"><button class="chip on" data-v="uni">合并视图</button><button class="chip" data-v="sbs">左右对比</button></div>
  <div id="stat" class="sub" style="margin:0 0 12px"></div>
  <div id="out"></div>
</div>
</div>
<script>
function lcs(a,b){
  const n=a.length,m=b.length,w=m+1,t=new Uint32Array((n+1)*w);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)t[i*w+j]=a[i]===b[j]?t[(i+1)*w+j+1]+1:Math.max(t[(i+1)*w+j],t[i*w+j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ops.push({t:'eq',a:a[i]});i++;j++}else if(t[(i+1)*w+j]>=t[i*w+j+1]){ops.push({t:'del',a:a[i]});i++}else{ops.push({t:'add',b:b[j]});j++}}
  while(i<n)ops.push({t:'del',a:a[i++]});while(j<m)ops.push({t:'add',b:b[j++]});
  return ops;
}
const tok=s=>s.match(/\s+|[\u3400-\u9fff]|[A-Za-z0-9_]+|[^\s]/g)||[];
function wordDiff(x,y){
  const A=tok(x),B=tok(y);
  if((A.length+1)*(B.length+1)>4e6)return [esc(x),esc(y)];
  let l='',r='';
  for(const o of lcs(A,B)){
    if(o.t==='eq'){l+=esc(o.a);r+=esc(o.a)}
    else if(o.t==='del')l+=`<mark class="d">${esc(o.a)}</mark>`;
    else r+=`<mark class="a">${esc(o.b)}</mark>`;
  }
  return [l,r];
}
let rows=[],view='uni';
function compare(){
  const a=$('ta').value.split(/\r?\n/),b=$('tb').value.split(/\r?\n/);
  if((a.length+1)*(b.length+1)>16e6){alert('文本太长，请分段对比');return}
  const ops=lcs(a,b);rows=[];let dels=[],adds=[];
  const flush=()=>{
    const k=Math.min(dels.length,adds.length);
    for(let i=0;i<k;i++){const [l,r]=wordDiff(dels[i],adds[i]);rows.push({t:'chg',l,r})}
    for(let i=k;i<dels.length;i++)rows.push({t:'del',l:esc(dels[i])});
    for(let i=k;i<adds.length;i++)rows.push({t:'add',r:esc(adds[i])});
    dels=[];adds=[];
  };
  for(const o of ops){if(o.t==='eq'){flush();rows.push({t:'eq',l:esc(o.a),r:esc(o.a)})}else if(o.t==='del')dels.push(o.a);else adds.push(o.b)}
  flush();
  const c=t=>rows.filter(r=>r.t===t).length,ad=c('add'),de=c('del'),ch=c('chg');
  $('resCard').hidden=false;
  $('stat').textContent=(ad+de+ch)?`新增 ${ad} 行，删除 ${de} 行，修改 ${ch} 行`:'两段文字完全相同';
  draw();
}
function draw(){
  const L=(h,c)=>`<div class="dl ${c}">${h||'&nbsp;'}</div>`;
  let h='';
  if(view==='sbs'){
    for(const r of rows){
      if(r.t==='eq')h+=L(r.l,'')+L(r.r,'');
      else if(r.t==='chg')h+=L(r.l,'del')+L(r.r,'add');
      else if(r.t==='del')h+=L(r.l,'del')+L('','empty');
      else h+=L('','empty')+L(r.r,'add');
    }
    $('out').innerHTML=`<div class="sbs">${h}</div>`;
  }else{
    for(const r of rows){
      if(r.t==='eq')h+=L('&nbsp; '+r.l,'');
      else if(r.t==='chg')h+=L('− '+r.l,'del')+L('+ '+r.r,'add');
      else if(r.t==='del')h+=L('− '+r.l,'del');
      else h+=L('+ '+r.r,'add');
    }
    $('out').innerHTML=`<div class="uni">${h}</div>`;
  }
}
$('go').onclick=compare;
$('clr').onclick=()=>{$('ta').value=$('tb').value='';$('resCard').hidden=true;$('ta').focus()};
$('views').onclick=e=>{const v=e.target.dataset.v;if(!v)return;view=v;[...$('views').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));draw()};
</script>

</body>
</html>
