<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语阅读 · 工具箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #eef3fb;
    --card: #ffffff;
    --panel: #e3efff;
    --panel-2: #dbe9ff;
    --text: #1c1c1e;
    --sub: #6b7280;
    --accent: #007aff;
    --accent-soft: #e5f0ff;
    --border: #dbe4f0;
    --kw: #b45309;
    --kw-bg: #fef3c7;
    --sent-hl: #fff1a8;
    --sent-hl-border: #f59e0b;
    --vocab-hl: #fff7cc;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(238,243,251,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 8px;
  }
  .topbar .row { display: flex; align-items: center; gap: 12px; max-width: 1080px; margin: 0 auto; }
  .topbar .back { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .meta { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .progress { height: 4px; background: #d7e3f5; border-radius: 99px; margin-top: 10px; overflow: hidden; max-width: 1080px; margin-left: auto; margin-right: auto; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .15s linear; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }

  /* ---------- home ---------- */
  .home-head h2 { font-size: 26px; font-weight: 700; }
  .home-head p { margin-top: 6px; font-size: 14px; color: var(--sub); line-height: 1.6; }
  .search { margin-top: 14px; display: flex; gap: 8px; }
  .search input {
    flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 99px; padding: 7px 14px; font-size: 13px; font-weight: 600;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .acard {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 8px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .acard:active { transform: scale(.97); }
  .acard .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 99px; padding: 3px 9px; background: var(--accent-soft); color: var(--accent); }
  .badge.lv-b1 { background: #dcfce7; color: #15803d; }
  .badge.lv-b2 { background: #dbeafe; color: #1d4ed8; }
  .badge.lv-c1 { background: #ede9fe; color: #6d28d9; }
  .acard h3 { font-size: 16px; line-height: 1.4; font-weight: 700; }
  .acard .desc { font-size: 13px; color: var(--sub); line-height: 1.6; flex: 1; }
  .acard .foot { font-size: 12px; color: var(--sub); }
  .acard .go { font-size: 13px; color: var(--accent); font-weight: 700; }
  .empty { padding: 32px 0; text-align: center; color: var(--sub); font-size: 14px; }

  /* ---------- 阅读页：文章单栏，跟页面一起滚（手机上划得动） ---------- */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .controls .spacer { flex: 1; }
  .ctl {
    border: 1px solid var(--border); background: #fff; border-radius: 99px;
    padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--text);
  }
  .ctl.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .article {
    background: var(--panel); border: 1px dashed #9db8e8; border-radius: 18px;
    padding: 18px 18px 140px;
  }
  .pane-title { font-size: 13px; color: var(--sub); font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }

  /* ---------- 底部悬浮重点词条 ---------- */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    max-width: 1080px; margin: 0 auto;
    background: #fff; border: 1px solid var(--border); border-bottom: none;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.14);
    height: 58px; overflow: hidden;
    transition: height .25s ease;
    display: flex; flex-direction: column;
  }
  .sheet.half { height: 46vh; }
  .sheet.full { height: 80vh; }
  .sheet-handle { flex: none; cursor: grab; touch-action: none; padding: 8px 16px 6px; user-select: none; }
  .sheet-handle:active { cursor: grabbing; }
  .sheet-handle .grip { width: 44px; height: 5px; border-radius: 99px; background: #cbd5e1; margin: 0 auto 8px; }
  .sheet-head { display: flex; align-items: center; gap: 8px; }
  .sheet-title { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .sheet-now {
    flex: 1; font-size: 13px; color: var(--sub);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sheet-now b { color: var(--kw); }
  .sheet-list {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 4px 16px 24px; -webkit-overflow-scrolling: touch;
  }

  /* article text */
  .para-block { margin-bottom: 20px; }
  .en-para { font-size: 17px; line-height: 1.9; font-family: Georgia, "Times New Roman", serif; }
  .en-para .sent {
    border-radius: 6px; padding: 1px 2px; cursor: pointer;
    transition: background .15s ease;
  }
  .en-para .sent:hover { background: #dbeafe; }
  .en-para .sent.active, .zh-para .sent.active {
    background: var(--sent-hl);
    box-shadow: 0 0 0 1.5px var(--sent-hl-border);
  }
  .kw {
    color: var(--kw); font-weight: 700; background: var(--kw-bg);
    border-bottom: 2px solid #f59e0b; border-radius: 4px; padding: 0 2px; cursor: pointer;
  }
  .kw.active-kw { background: #fde68a; box-shadow: 0 0 0 1.5px #f59e0b; }
  .zh-label { font-size: 11px; color: var(--sub); font-weight: 700; letter-spacing: 1px; margin: 8px 0 4px; }
  .zh-para { font-size: 14.5px; line-height: 1.9; color: #374151; }
  .zh-para .sent { border-radius: 6px; padding: 1px 2px; cursor: pointer; }
  .zh-para .sent:hover { background: #e0e7ff; }
  .no-trans .zh-label, .no-trans .zh-para { display: none; }
  .hint { font-size: 12.5px; color: var(--sub); line-height: 1.7; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }

  /* vocab cards */
  .vcard {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .vcard:hover { border-color: var(--accent); }
  .vcard.active { background: var(--vocab-hl); border-color: #f59e0b; box-shadow: 0 0 0 1.5px #f59e0b; }
  .vcard .w { font-size: 16px; font-weight: 700; }
  .vcard .w .ph { font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 6px; }
  .vcard .pos { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 8px; margin-top: 6px; }
  .vcard .zh { font-size: 14px; margin-top: 6px; line-height: 1.6; }
  .vcard .en-def { font-size: 12.5px; color: var(--sub); margin-top: 4px; line-height: 1.6; }
  .vcard .ex { font-size: 13px; margin-top: 8px; line-height: 1.6; font-style: italic; color: #374151; }
  .vcard .ex-zh { font-size: 12.5px; color: var(--sub); line-height: 1.6; }
  footer { padding: 20px; text-align: center; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>

<div class="topbar">
  <div class="row">
    <a class="back" href="index.html">‹ 工具箱</a>
    <h1 id="topTitle">英语阅读</h1>
    <span class="meta" id="topMeta"></span>
  </div>
  <div class="progress hidden" id="progressBar"><i id="progressFill"></i></div>
</div>

<!-- home -->
<main class="wrap" id="homeView">
  <div class="home-head">
    <h2>英语阅读</h2>
    <p>点开一篇文章，左边读原文，右边看重点词；每段下面都有中文翻译，点一句英文，高亮的译句会跟着亮起来。</p>
  </div>
  <div class="search"><input id="searchInput" type="search" placeholder="搜文章标题、分类…"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="articleGrid"></div>
  <div class="empty hidden" id="emptyMsg">没有找到这篇文章，换个词试试。</div>
</main>

<!-- reading -->
<main class="wrap hidden" id="readView">
  <div class="controls">
    <button class="ctl" id="backBtn">‹ 返回列表</button>
    <span class="spacer"></span>
    <button class="ctl" id="transToggle">译文：开</button>
    <button class="ctl on" id="syncToggle">同步：开</button>
    <button class="ctl" id="fontDown">A−</button>
    <button class="ctl" id="fontUp">A＋</button>
  </div>
  <div class="article" id="articleWrap">
    <h2 class="pane-title">文章内容 · 点一句，高亮译句</h2>
    <div class="hint">点英文里的一句话，它和下面译文里对应的那句会一起变黄；点译文里的一句也一样。点文章里的重点词，下面那个条会展开并跳到对应的词卡。</div>
    <div id="articleBody"></div>
  </div>

  <!-- 重点词翻译：悬浮在底部的条，点横条展开 / 收起，也能上下拖 -->
  <div class="sheet" id="sheet" aria-label="重点词翻译">
    <div class="sheet-handle" id="sheetHandle">
      <div class="grip"></div>
      <div class="sheet-head">
        <span class="sheet-title">重点词翻译</span>
        <span class="sheet-now" id="sheetNow"></span>
        <button class="ctl" id="sheetToggle" type="button">展开 ▲</button>
      </div>
    </div>
    <div class="sheet-list" id="sheetList"><div id="vocabBody"></div></div>
  </div>
</main>

<footer>英语阅读 · 工具箱 · 部署在 Abasthan</footer>

<script>
'use strict';
/* 数据：每篇文章 3 段，每段 3 句，英文句与中文译句一一对应（按段、按句对齐）。
   vocab 里每个词都在正文里出现过，顺序就是它在文章里第一次出现的顺序。 */
/* 文章不在 HTML 里了，放在 articles/ 文件夹，一篇一个 JSON。
   页面打开时自动发现那里的 JSON 文件：先问 GitHub 要文件列表
   （新加的文章不用改任何列表，推上去就能被发现），
   问不到就用 articles/index.json 这个备用列表。 */
let ARTICLES = [];
const ARTICLES_DIR = 'articles';
const GH_API = 'https://api.github.com/repos/maxforeee/my-first-app/contents/articles';
async function loadArticles() {
  let names = [];
  try {
    const r = await fetch(GH_API, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub list ' + r.status);
    const list = await r.json();
    names = list.filter(function (f) {
      return f.type === 'file' && /\.json$/i.test(f.name) && f.name.charAt(0) !== '_' && f.name !== 'index.json';
    }).map(function (f) { return f.name; }).sort();
  } catch (e) { names = []; }
  if (!names.length) {
    try {
      const r = await fetch(ARTICLES_DIR + '/index.json', { cache: 'no-store' });
      if (r.ok) names = await r.json();
    } catch (e) { /* 备用列表也拿不到就空着，下面会提示 */ }
  }
  const out = [];
  for (const name of names) {
    try {
      const r = await fetch(ARTICLES_DIR + '/' + name, { cache: 'no-store' });
      if (r.ok) out.push(await r.json());
    } catch (e) { /* 某一篇坏了就跳过，不影响别的篇 */ }
  }
  ARTICLES = out;
}

var $ = function (id) { return document.getElementById(id); };
var homeView = $('homeView'), readView = $('readView');
var sheet = $('sheet'), sheetList = $('sheetList');
var SHEET_STATES = ['', 'half', 'full'];
var sheetState = 0; /* 0 收起成一条，1 半开，2 全开 */
var current = null, syncOn = true, syncing = false, fontSize = 17;
var anchors = []; /* [{left, right}] 按词的位置锚定 */

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function wordCount(a) {
  var n = 0;
  a.paras.forEach(function (p) { p.en.forEach(function (s) { n += s.split(/\s+/).length; }); });
  return n;
}

/* ---------- 首页 ---------- */
var levelFilter = '全部';
var LEVELS = ['全部', 'B1', 'B2', 'C1'];
function renderChips() {
  $('chips').innerHTML = LEVELS.map(function (lv) {
    return '<button class="chip' + (lv === levelFilter ? ' on' : '') + '" data-lv="' + lv + '">' + lv + '</button>';
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () { levelFilter = b.getAttribute('data-lv'); renderChips(); renderHome(); });
  });
}
function renderHome() {
  var q = ($('searchInput').value || '').trim().toLowerCase();
  var list = ARTICLES.filter(function (a) {
    var okLv = levelFilter === '全部' || a.level === levelFilter;
    var okQ = !q || (a.title + a.cat + a.desc).toLowerCase().indexOf(q) !== -1;
    return okLv && okQ;
  });
  $('articleGrid').innerHTML = list.map(function (a) {
    return '<button class="acard" data-id="' + a.id + '">' +
      '<span class="badges"><span class="badge lv-' + a.level.toLowerCase() + '">' + a.level + '</span>' +
      '<span class="badge">' + a.cat + '</span></span>' +
      '<h3>' + esc(a.title) + '</h3>' +
      '<span class="desc">' + esc(a.desc) + '</span>' +
      '<span class="foot">' + wordCount(a) + ' 词 · 约 ' + a.minutes + ' 分钟 · ' + a.vocab.length + ' 个重点词</span>' +
      '<span class="go">开始读 →</span></button>';
  }).join('');
  $('emptyMsg').classList.toggle('hidden', list.length > 0);
  $('articleGrid').querySelectorAll('.acard').forEach(function (c) {
    c.addEventListener('click', function () { openArticle(c.getAttribute('data-id')); });
  });
}

/* ---------- 阅读页：渲染 ---------- */
function markKeywords(sentence, vocab) {
  var html = esc(sentence);
  var sorted = vocab.map(function (v, i) { return { w: v.w, i: i }; })
    .sort(function (a, b) { return b.w.length - a.w.length; });
  sorted.forEach(function (item) {
    /* 允许复数 / 三单词尾：creatures、temples、disappears 都能标出来 */
    var re = new RegExp('\\b(' + item.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(s|es)?\\b', 'i');
    html = html.replace(re, '<span class="kw" data-v="' + item.i + '">$1$2</span>');
  });
  return html;
}
function openArticle(id) {
  current = null;
  for (var k = 0; k < ARTICLES.length; k++) if (ARTICLES[k].id === id) current = ARTICLES[k];
  if (!current) return;
  $('topTitle').textContent = current.title;
  $('topMeta').textContent = current.level + ' · ' + current.cat;
  $('progressBar').classList.remove('hidden');
  homeView.classList.add('hidden');
  readView.classList.remove('hidden');
  window.scrollTo(0, 0);

  var body = '';
  current.paras.forEach(function (p, pi) {
    body += '<div class="para-block" data-p="' + pi + '">';
    body += '<p class="en-para" style="font-size:' + fontSize + 'px">' +
      p.en.map(function (s, si) {
        return '<span class="sent" data-p="' + pi + '" data-s="' + si + '">' + markKeywords(s, current.vocab) + '</span>';
      }).join(' ') + '</p>';
    body += '<div class="zh-label">译文</div><p class="zh-para">' +
      p.zh.map(function (s, si) {
        return '<span class="sent" data-p="' + pi + '" data-s="' + si + '">' + esc(s) + '</span>';
      }).join('') + '</p></div>';
  });
  $('articleBody').innerHTML = body;

  $('vocabBody').innerHTML = current.vocab.map(function (v, i) {
    return '<div class="vcard" data-v="' + i + '"><div class="w">' + esc(v.w) +
      '<span class="ph">' + esc(v.ph) + '</span></div>' +
      '<span class="pos">' + esc(v.pos) + '</span>' +
      '<div class="zh">' + esc(v.zh) + '</div>' +
      '<div class="en-def">' + esc(v.en) + '</div>' +
      '<div class="ex">“' + esc(v.ex) + '”</div>' +
      '<div class="ex-zh">' + esc(v.exZh) + '</div></div>';
  }).join('');

  sheetState = 0;
  sheet.className = 'sheet';
  $('sheetToggle').textContent = '展开 ▲';
  sheetList.scrollTop = 0;
  setSheetNow(-1);
  window.scrollTo(0, 0);
  updateProgress();
  requestAnimationFrame(buildAnchors);
}

/* ---------- 同步滚动：按词语位置锚定，分段插值 ----------
   左边是整页滚动（window），右边是底部条里的词卡列表。
   每个重点词在文章里的位置，对应它词卡在列表里的位置；
   某一行重点词多，那一段词卡就滚得快，行滚出顶部时，对应词卡也正好滚出条顶。 */
function docTop(el) { return el.getBoundingClientRect().top + window.scrollY; }
function cardTopInList(card) {
  return card.getBoundingClientRect().top - sheetList.getBoundingClientRect().top + sheetList.scrollTop;
}
function buildAnchors() {
  anchors = [{ left: 0, right: 0 }];
  if (!current) return;
  var cards = $('vocabBody').querySelectorAll('.vcard');
  var topOffset = 140; /* 词滚到顶部栏下方时，对应词卡滚到条顶 */
  current.vocab.forEach(function (v, i) {
    var kw = $('articleBody').querySelector('.kw[data-v="' + i + '"]');
    var card = cards[i];
    if (!kw || !card) return;
    anchors.push({ left: Math.max(0, docTop(kw) - topOffset), right: cardTopInList(card) });
  });
  anchors.push({ left: maxPageScroll(), right: maxListScroll() });
  anchors.sort(function (a, b) { return a.left - b.left || a.right - b.right; });
}
function maxPageScroll() {
  return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
}
function maxListScroll() {
  return Math.max(0, sheetList.scrollHeight - sheetList.clientHeight);
}
function syncRight() {
  if (!syncOn || syncing || !current || anchors.length < 2) return;
  var x = window.scrollY;
  var maxL = maxPageScroll(), maxR = maxListScroll();
  if (maxL <= 0 || maxR <= 0) { sheetList.scrollTop = 0; return; }
  x = Math.max(0, Math.min(maxL, x));
  var target = maxR;
  for (var i = 0; i < anchors.length - 1; i++) {
    var a = anchors[i], b = anchors[i + 1];
    if (x >= a.left && x <= b.left) {
      if (b.left === a.left) { target = b.right; }
      else { target = a.right + (x - a.left) * (b.right - a.right) / (b.left - a.left); }
      break;
    }
  }
  syncing = true;
  sheetList.scrollTop = Math.max(0, Math.min(maxR, target));
  syncing = false;
  highlightActiveVocab(x);
}
function setSheetNow(idx) {
  var el = $('sheetNow');
  if (!current) { el.textContent = ''; return; }
  if (idx < 0) { el.innerHTML = '共 ' + current.vocab.length + ' 个重点词 · 点横条展开'; return; }
  var v = current.vocab[idx];
  el.innerHTML = '当前：<b>' + esc(v.w) + '</b> · ' + esc(v.zh);
}
function highlightActiveVocab(x) {
  var active = 0;
  for (var i = 0; i < anchors.length; i++) if (anchors[i].left <= x + 40) active = i;
  var idx = Math.max(0, active - 1); /* anchors[0] 是起点，减一才是词卡序号 */
  var cards = $('vocabBody').querySelectorAll('.vcard');
  cards.forEach(function (c, i) { c.classList.toggle('active', i === idx); });
  $('articleBody').querySelectorAll('.kw').forEach(function (k) {
    k.classList.toggle('active-kw', +k.getAttribute('data-v') === idx);
  });
  setSheetNow(idx);
}
function updateProgress() {
  var max = maxPageScroll();
  var p = max > 0 ? (window.scrollY / max) * 100 : 0;
  $('progressFill').style.width = p + '%';
}
var rafPending = false;
window.addEventListener('scroll', function () {
  updateProgress();
  if (!rafPending) {
    rafPending = true;
    requestAnimationFrame(function () { rafPending = false; syncRight(); });
  }
}, { passive: true });
window.addEventListener('resize', function () { if (current) buildAnchors(); });

/* ---------- 点句同步高亮：英文句与译文句成对亮 ---------- */
function highlightSentence(p, s, scrollToZh) {
  document.querySelectorAll('#articleBody .sent').forEach(function (el) { el.classList.remove('active'); });
  var pair = document.querySelectorAll('#articleBody .sent[data-p="' + p + '"][data-s="' + s + '"]');
  pair.forEach(function (el) { el.classList.add('active'); });
  if (scrollToZh && pair.length > 1) {
    var zhEl = null;
    pair.forEach(function (el) { if (el.closest('.zh-para')) zhEl = el; });
    if (zhEl) {
      var r = zhEl.getBoundingClientRect();
      if (r.bottom > window.innerHeight - 70 || r.top < 110) zhEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}
$('articleBody').addEventListener('click', function (e) {
  var kw = e.target.closest('.kw');
  if (kw) {
    var vi = +kw.getAttribute('data-v');
    var card = $('vocabBody').querySelector('.vcard[data-v="' + vi + '"]');
    if (card) {
      setSheetState(1); /* 点重点词就把底下的条展开 */
      $('vocabBody').querySelectorAll('.vcard').forEach(function (c) { c.classList.remove('active'); });
      card.classList.add('active');
      sheetList.scrollTo({ top: cardTopInList(card) - 8, behavior: 'smooth' });
    }
    return;
  }
  var sent = e.target.closest('.sent');
  if (sent) highlightSentence(sent.getAttribute('data-p'), sent.getAttribute('data-s'), true);
});
$('vocabBody').addEventListener('click', function (e) {
  var card = e.target.closest('.vcard');
  if (!card) return;
  var vi = +card.getAttribute('data-v');
  var kw = $('articleBody').querySelector('.kw[data-v="' + vi + '"]');
  if (!kw) return;
  $('articleBody').querySelectorAll('.kw').forEach(function (k) { k.classList.remove('active-kw'); });
  kw.classList.add('active-kw');
  window.scrollTo({ top: Math.max(0, docTop(kw) - 140), behavior: 'smooth' });
});

/* ---------- 控件 ---------- */
$('backBtn').addEventListener('click', function () {
  current = null;
  readView.classList.add('hidden');
  homeView.classList.remove('hidden');
  $('topTitle').textContent = '英语阅读';
  $('topMeta').textContent = '';
  $('progressBar').classList.add('hidden');
});
$('transToggle').addEventListener('click', function () {
  var off = $('articleBody').classList.toggle('no-trans');
  this.textContent = off ? '译文：关' : '译文：开';
  this.classList.toggle('on', !off);
  requestAnimationFrame(buildAnchors);
});
$('syncToggle').addEventListener('click', function () {
  syncOn = !syncOn;
  this.textContent = syncOn ? '同步：开' : '同步：关';
  this.classList.toggle('on', syncOn);
  if (syncOn) syncRight();
});
$('fontDown').addEventListener('click', function () {
  fontSize = Math.max(14, fontSize - 1);
  document.querySelectorAll('.en-para').forEach(function (p) { p.style.fontSize = fontSize + 'px'; });
  requestAnimationFrame(buildAnchors);
});
$('fontUp').addEventListener('click', function () {
  fontSize = Math.min(22, fontSize + 1);
  document.querySelectorAll('.en-para').forEach(function (p) { p.style.fontSize = fontSize + 'px'; });
  requestAnimationFrame(buildAnchors);
});
/* ---------- 底部条：点横条展开 / 收起，也能上下拖 ---------- */
function setSheetState(n) {
  sheetState = n;
  sheet.className = 'sheet' + (SHEET_STATES[n] ? ' ' + SHEET_STATES[n] : '');
  $('sheetToggle').textContent = n === 0 ? '展开 ▲' : (n === 1 ? '再展开 ▲▲' : '收起 ▼');
}
var justDragged = false;
$('sheetToggle').addEventListener('click', function (e) {
  e.stopPropagation();
  setSheetState((sheetState + 1) % 3);
});
/* 点横条就是展开 / 收起两态切换，不再三态循环 */
$('sheetHandle').addEventListener('click', function () {
  if (justDragged) return;
  setSheetState(sheetState === 0 ? 1 : 0);
});
(function () {
  /* 用 Pointer Events：手指和鼠标拖动都管用（之前只听 touch，桌面浏览器拖不动） */
  var startY = null, moved = 0;
  var h = $('sheetHandle');
  h.addEventListener('pointerdown', function (e) {
    startY = e.clientY; moved = 0;
    try { h.setPointerCapture(e.pointerId); } catch (err) {}
  });
  h.addEventListener('pointermove', function (e) { if (startY !== null) moved = e.clientY - startY; });
  h.addEventListener('pointerup', function () {
    if (startY === null) return;
    if (moved < -50) { justDragged = true; setTimeout(function () { justDragged = false; }, 350); setSheetState(Math.min(2, sheetState + 1)); }
    else if (moved > 50) { justDragged = true; setTimeout(function () { justDragged = false; }, 350); setSheetState(Math.max(0, sheetState - 1)); }
    startY = null;
  });
  h.addEventListener('pointercancel', function () { startY = null; });
})();

$('searchInput').addEventListener('input', renderHome);

renderChips();
$('articleGrid').innerHTML = '<div class="empty">正在加载文章…</div>';
loadArticles().then(function () {
  renderHome();
  if (!ARTICLES.length) $('articleGrid').innerHTML = '<div class="empty">文章没加载出来，检查一下网络再刷新试试。</div>';
});
</script>
