    if(index===0){term+=Math.imul(CS64_ADJUSTMENT0,factors[0]);offset+=CS64_ADJUSTMENT1}
    terms.push(term>>>0);
    offsets.push(offset>>>0);
  });
  let swapAcc=0,swapLast=0,state=0,acc=0;
  for(let index=0;index<terms.length;index+=2){
    const x=terms[index],y=terms[index+1];
    let q=Math.imul(rol16((offsets[index]+x)>>>0),0x76f50f34)>>>0;
    swapAcc=(swapAcc+Math.imul(rol16(q),0xc3efea97)+q)>>>0;
    q=Math.imul(rol16((offsets[index+1]+y)>>>0),0x1881ce3c)>>>0;
    swapLast=(Math.imul(rol16(q),0x35bd1ec9)+q)>>>0;
    swapAcc=(swapAcc+swapLast)>>>0;
    state=(Math.imul(state,keyA)+x)>>>0;
    state=Math.imul(rol16(state),0xcf98b111)>>>0;
    state=Math.imul(rol16(state),0x87085b9f)>>>0;
    state=Math.imul(rol16(state),0x12ceb96d)>>>0;
    state=Math.imul(rol16(state),0x257e1d83)>>>0;
    acc=(acc+state)>>>0;
    let t=(Math.imul(state,keyB)+y)>>>0;
    t=Math.imul(rol16(t),0xa27416f5)>>>0;
    t=Math.imul(rol16(t),0xd38396ff)>>>0;
    t=Math.imul(rol16(t),0x7c932b89)>>>0;
    state=Math.imul(rol16(t),0xbfa49f69)>>>0;
    acc=(acc+state)>>>0;
  }
  return[(swapLast^state)>>>0,(swapAcc^acc)>>>0];
}
function toHex(bytes){return Array.from(bytes).map(byte=>byte.toString(16).padStart(2,"0")).join("").toUpperCase()}
function hashSecMsGecPayload(payload){
  const bytes=new TextEncoder().encode(payload);
  const digest=sha256Digest(bytes);
  const checksum=new Uint8Array(8);
  const checksumView=new DataView(checksum.buffer);
  cs64Digest(bytes,digest).forEach((word,index)=>checksumView.setUint32(index*4,word,true));
  return toHex(checksum)+"-"+toHex(digest);
}
function generateSecMsGec(trustedClientToken,unixSeconds){
  if(unixSeconds===undefined)unixSeconds=Date.now()/1000;
  let ticks=unixSeconds+WIN_EPOCH_SECONDS;
  ticks-=ticks%TOKEN_WINDOW_SECONDS;
  ticks*=1e7;
  return hashSecMsGecPayload(ticks.toFixed(0)+trustedClientToken);
}
function edgeSay(t,k,r){
 if(!window.WebSocket)return Promise.reject(new Error('no edge'));
 const my=++reqSeq;
 let gec;
 try{gec=generateSecMsGec(EDGE_TOKEN)}catch(e){return Promise.reject(e)}
 return new Promise((res,rej)=>{
  let done=false;const chunks=[];
  const s=new WebSocket(EDGE_WSS+'?TrustedClientToken='+EDGE_TOKEN+'&Sec-MS-GEC='+gec+'&Sec-MS-GEC-Version='+EDGE_VER+'&ConnectionId='+encodeURIComponent(uuid().replace(/-/g,'')));
  ws=s;
  const to=setTimeout(()=>fail(new Error('timeout')),8000);
  function fail(e){if(done)return;done=true;clearTimeout(to);try{s.close()}catch(_){}rej(e)}
  function ok(){if(done)return;done=true;clearTimeout(to);try{s.close()}catch(_){}res()}
  function finish(){
   if(done)return;
   if(!chunks.length){fail(new Error('no audio'));return}
   const blob=new Blob(chunks,{type:'audio/mpeg'});
   if(auUrl)URL.revokeObjectURL(auUrl);
   auUrl=URL.createObjectURL(blob);
   au=new Audio(auUrl);
   au.onended=()=>{if(cur===k)setP(null)};
   au.onerror=()=>{if(cur===k)setP(null);fail(new Error('audio error'))};
   au.play().then(ok).catch(fail)}
  s.binaryType='arraybuffer';
  s.onopen=()=>{
   if(my!==reqSeq||cur!==k){fail(new Error('stale'));return}
   try{
    s.send('X-Timestamp:'+ts()+'\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"true"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}\r\n');
    const ssml="<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='ja-JP'><voice name='"+EDGE_VOICE+"'><prosody pitch='+0Hz' rate='"+ratePct(r)+"' volume='+0%'>"+escXml(t)+"</prosody></voice></speak>";
    s.send('X-RequestId:'+uuid()+'\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:'+ts()+'Z\r\nPath:ssml\r\n\r\n'+ssml);
   }catch(e){fail(e)}};
  s.onmessage=e=>{
   if(my!==reqSeq||cur!==k){fail(new Error('stale'));return}
   if(typeof e.data==='string'){if(e.data.indexOf('Path:turn.end')>-1)finish();return}
   const b=new Uint8Array(e.data);
   if(b.length<2)return;
   const hl=(b[0]<<8)|b[1];
   if(b.length<2+hl)return;
   if(new TextDecoder().decode(b.slice(2,2+hl)).indexOf('Path:audio')>-1)chunks.push(b.slice(2+hl))};
  s.onerror=()=>fail(new Error('ws error'));
  s.onclose=()=>{if(!done&&chunks.length)finish();else if(!done)fail(new Error('closed'))};
 })}
function sysSay(t,k,rate){
 if(!sy||typeof SpeechSynthesisUtterance=='undefined'){if(cur===k)setP(null);toast('发音失败：联网和系统语音都不可用');return}
 const v=sy.getVoices(),ja=v.find(x=>/^ja/i.test(x.lang.replace('_','-')));
 if(v.length&&!ja){if(cur===k)setP(null);toast('发音失败：联网不可用，且这台手机没有日语语音');return}
 try{sy.cancel()}catch(e){}
 const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';if(ja)u.voice=ja;u.rate=rate;
 u.onend=()=>{if(cur===k)setP(null)};
 u.onerror=e=>{if(cur===k)setP(null);if(e.error&&!/canceled|interrupted/.test(e.error))toast('发音失败：联网和系统语音都不可用')};
 sy.speak(u)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function setP(k){cur=k;document.querySelectorAll('.pl').forEach(e=>e.classList.remove('pl'));if(k)document.querySelectorAll('[data-key="'+k+'"]').forEach(e=>e.classList.add('pl'))}
function stop(){reqSeq++;if(ws){try{ws.close()}catch(e){}ws=null}if(au){try{au.pause()}catch(e){}au=null}if(sy)try{sy.cancel()}catch(e){}setP(null)}
function say(t,k,rate){
 if(cur===k){stop();return}
 stop();
 rate=rate||.8;
 setP(k);
 edgeSay(t,k,rate).catch(()=>{if(cur===k)sysSay(t,k,rate)})}
/* ===== 状态 ===== */
let pg='home',Q=null;const ui={sc:'both',row:'all',sel:null,wg:'问候',rate:.8,H:{},rc:0};
const ch=(a,v,t,on)=>`<button class="chip${on?' on':''}" data-a="${a}" data-v="${v}">${t}</button>`;
const back=t=>`<div class="top"><a class="back" href="index.html" onclick="if(history.length>1){history.back();return false}">‹ 返回</a><h2>${t}</h2></div>`;
const mk=(id,m)=>`<button class="mk${S[id]?' m':''}" data-a="mk" data-v="${id}" aria-label="标记已掌握">✓</button>`;
/* ===== 页面 ===== */
function Home(){
 const en=(v,t,d,a)=>`<button class="card en" data-a="go" data-v="${v}"><b>${t}</b><span>${d}</span>${a?bar(pr(a),a.length)+`<small>已掌握 ${pr(a)} / ${a.length}</small>`:''}</button>`;
 const all=[...KA,...WA,...SA],n=pr(all);
 return `<div class="top"><a class="back" href="index.html" onclick="if(history.length>1){history.back();return false}">‹ 返回</a></div><div class="card hd"><h1>日语入门</h1><div class="sub">总进度：已掌握 ${n} / ${all.length}（假名 + 单词 + 常用句）</div>${bar(n,all.length)}</div>
 ${en('kana','五十音图','平假名 · 片假名 · 浊音 · 拗音',KA)}
 ${en('word','基础词汇','70 个入门单词，7 组',WA)}
 ${en('sent','常用句','20 句日常用语',SA)}
 ${en('quiz','小测验','认假名 · 听音选假名 · 认单词')}
 <button class="rst${ui.rc?' c':''}" data-a="rs">${ui.rc?'再点一次，确认清除全部进度':'重置进度'}</button>`}
function Kana(){
 const gs=['基本音','浊音 / 半浊音','拗音'],rows=[...new Set(K.map(x=>x.n))];
 const kb=(x,s)=>{const id=s+':'+x[s];return `<button class="kb jp${S[id]?' m':''}${ui.sel===id?' sel':''}" data-a="k" data-v="${id}" data-key="${id}">${x[s]}</button>`};
 const cell=x=>x.e?'<div class="cell e"></div>':`<div class="cell">${ui.sc!='k'?kb(x,'h'):''}${ui.sc!='h'?kb(x,'k'):''}<div class="r">${x.r}</div></div>`;
 let h=back('五十音图')+`<div class="sub" style="margin:-2px 2px 4px">已掌握 ${pr(KA)} / ${KA.length}</div>`+bar(pr(KA),KA.length);
 h+=`<div class="chips">${[['both','对照'],['h','平假名'],['k','片假名']].map(a=>ch('sc',a[0],a[1],ui.sc==a[0])).join('')}</div>`;
 h+=`<div class="chips">${ch('row','all','全部',ui.row=='all')+rows.map(r=>ch('row',r,r,ui.row==r)).join('')}</div>`;
 [0,1,2].forEach(g=>{const it=K.filter(x=>x.g==g&&(ui.row=='all'||x.n==ui.row));if(it.length)h+=`<h3>${gs[g]}</h3><div class="g${g==2?' y':''}">${it.map(cell).join('')}</div>`});
 const id=ui.sel,x=id&&K.find(y=>y[id[0]]===id.slice(2));
 return h+(x?`<div id="sel"><span class="jp bk">${id.slice(2)}</span><span class="br">${x.r}</span><button class="mb${S[id]?' m':''}" data-a="mk" data-v="${id}">${S[id]?'✓ 已掌握':'标记已掌握'}</button></div>`:`<div id="sel"><span class="sub">点一下假名，听发音、看罗马音</span></div>`)}
function Word(){
 const gs=Object.keys(WG);
 let h=back('基础词汇')+`<div class="sub" style="margin:-2px 2px 4px">已掌握 ${pr(WA)} / ${WA.length}</div>`+bar(pr(WA),WA.length);
 h+=`<div class="chips">${gs.map(g=>ch('wg',g,g,ui.wg==g)).join('')}</div>`;
 h+=`<div class="chips">${ch('hz',1,'遮住中文')+ch('hz',0,'显示中文')}</div>`;
 W.forEach((w,i)=>{if(w.g!=ui.wg)return;
  h+=`<div class="card it" data-key="w${i}"><div class="col"><button class="tx" data-a="sw" data-v="${i}"><span class="big jp">${w.j}</span><span class="rd jp">${w.k!=w.j?w.k+' · ':''}${w.r}</span></button><button class="zh${ui.H[i]?' h':''}" data-a="zh" data-v="${i}">${ui.H[i]?'点击显示':w.z}</button></div>${mk('w:'+w.j)}</div>`});
 return h}
function Sent(){
 let h=back('常用句')+`<div class="sub" style="margin:-2px 2px 4px">已掌握 ${pr(SA)} / ${SA.length}</div>`+bar(pr(SA),SA.length);
 h+=`<div class="chips">${[[.8,'默认语速'],[.5,'0.5x'],[.75,'0.75x'],[1,'1x']].map(a=>ch('rt',a[0],a[1],ui.rate==a[0])).join('')}</div>`;
 T.forEach((t,i)=>{h+=`<div class="card it" data-key="s${i}"><div class="col"><button class="tx" data-a="ss" data-v="${i}"><span class="big jp" style="font-size:22px">${t.j}</span><span class="rd jp">${t.k!=t.j?t.k+'<br>':''}${t.r}</span><span style="display:block;margin-top:4px;font-size:17px">${t.z}</span></button></div>${mk('s:'+i)}</div>`});
 return h}
function Quiz(){
 let h=back('小测验');
 if(!Q)return h+`<p class="sub">每轮 10 题，答错会马上显示正确答案；答对的会自动记为已掌握。</p>`+[['认假名','看假名，选罗马音'],['听音选假名','听发音，选对应的假名'],['认单词','看日语单词，选中文意思']].map((a,i)=>`<button class="card en" data-a="qs" data-v="${i}"><b>${a[0]}</b><span>${a[1]}</span></button>`).join('');
 if(Q.done){
  return h+`<div class="card"><div class="sub" style="text-align:center">本轮得分</div><div class="sc">${Q.sc} / 10</div></div>`+
  (Q.wr.length?`<h3>错题回顾</h3>`+Q.wr.map(q=>`<div class="card"><span class="jp" style="font-size:22px">${q.rv}</span><br><span style="color:var(--ok);font-weight:600">正确：<span class="jp">${q.a}</span></span> <span style="color:var(--bad)">你选：<span class="jp">${q.pick}</span></span></div>`).join(''):`<p class="fb">全部答对，太棒了！</p>`)+
  `<button class="main" data-a="qs" data-v="${Q.m}">再来一轮</button><button class="main" style="background:var(--accent-soft);color:var(--accent)" data-a="qm">换个模式</button>`}
 const q=Q.qs[Q.i],d=q.pick!=null;
 h+=`<div class="sub" style="text-align:center">第 ${Q.i+1} / 10 题</div>`;
 h+=Q.m==1?`<div class="pq">🔊</div><button class="pb" data-a="rp">再听一次</button>`:`<div class="pq jp${Q.m==2?' w':''}">${q.p}</div>`;
 h+=q.o.map((o,i)=>`<button class="opt${Q.m==1?' jp':''}${d&&o==q.a?' ok':''}${d&&o==q.pick&&o!=q.a?' bad':''}" style="${Q.m==1?'font-size:30px':''}" data-a="ans" data-v="${i}">${o}</button>`).join('');
 if(d)h+=`<div class="fb" style="color:var(--${q.pick==q.a?'ok':'bad'})">${q.pick==q.a?'✓ 答对了':'✗ 正确答案：'+q.a}</div><button class="main" data-a="nx">${Q.i==9?'看结果':'下一题'}</button>`;
 return h}
function render(fresh){
 const sl=fresh?[]:[...document.querySelectorAll('.chips')].map(e=>e.scrollLeft);
 $('#app').innerHTML=({home:Home,kana:Kana,word:Word,sent:Sent,quiz:Quiz})[pg]();
 document.querySelectorAll('.chips').forEach((e,i)=>e.scrollLeft=sl[i]||0);
 if(cur)setP(cur)}
/* ===== 测验 ===== */
const dis=(pool,f,c)=>{const s=new Set([c]),o=[];for(const y of sh(pool)){const v=f(y);if(!s.has(v)){s.add(v);o.push(v);if(o.length==3)break}}return o};
function qstart(m){
 const qs=(m<2?sh(KK):sh(W)).slice(0,10).map(x=>{
  if(m==2)return{p:x.j,a:x.z,o:sh([x.z,...dis(W,y=>y.z,x.z)]),id:'w:'+x.j,rv:x.j};
  const s=Math.random()<.5?'h':'k',id=s+':'+x[s];
  if(m==0)return{p:x[s],a:x.r,o:sh([x.r,...dis(KK,y=>y.r,x.r)]),id,rv:x[s]};
  return{au:x[s],a:x[s],o:sh([x[s],...dis(KK.filter(y=>y.r!=x.r),y=>y[s],x[s])]),id,rv:'听音题（'+x.r+'）'}});
 Q={m:+m,qs,i:0,sc:0,wr:[],done:0};render(1);qplay()}
function qplay(){const q=Q&&!Q.done&&Q.qs[Q.i];if(Q&&Q.m==1&&q&&q.pick==null)say(q.au,'q'+Q.i,.8)}
/* ===== 事件 ===== */
const A={
 go(v){stop();pg=v;if(v=='home')Q=null;scrollTo(0,0);render(1)},
 sc(v){ui.sc=v;render()},row(v){ui.row=v;render()},
 k(id){ui.sel=id;say(id.slice(2),id,.8);render()},
 mk(id){S[id]?delete S[id]:S[id]=1;sv();render()},
 wg(v){stop();ui.wg=v;scrollTo(0,0);render(1)},
 hz(v){W.forEach((w,i)=>{if(w.g==ui.wg)ui.H[i]=+v});render()},
 zh(i){ui.H[i]=!ui.H[i];render()},
 sw(i){say(W[i].k,'w'+i,.8)},
 rt(v){ui.rate=+v;render()},
 ss(i){say(T[i].k.replace(/〜/g,'、'),'s'+i,ui.rate)},
 qs(m){stop();qstart(m)},qm(){Q=null;render(1)},
 rp(){const q=Q.qs[Q.i];say(q.au,'q'+Q.i,.8)},
 ans(i){const q=Q.qs[Q.i];if(q.pick!=null)return;q.pick=q.o[i];if(q.pick==q.a){Q.sc++;S[q.id]=1;sv()}else Q.wr.push(q);render()},
 nx(){stop();Q.i++;if(Q.i>=10)Q.done=1;scrollTo(0,0);render(1);qplay()},
 rs(){if(!ui.rc){ui.rc=1;render();setTimeout(()=>{ui.rc=0;if(pg=='home')render()},4000)}else{S={};sv();ui.rc=0;ui.sel=null;render();toast('进度已重置')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v)});

render(1);
