<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>工具箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #8e8e93;
    --accent: #007aff;
    --accent-soft: #e5f0ff;
    --border: #e5e5ea;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 32px;
  }
  header {
    padding: 28px 20px 16px;
  }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: .5px; }
  header p { margin-top: 6px; font-size: 14px; color: var(--sub); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 8px 20px 0;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform: scale(.97); }
  .card .icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; font-weight: 600; }
  .card p { margin-top: 4px; font-size: 12px; color: var(--sub); line-height: 1.5; }
  .card .go {
    display: inline-block; margin-top: 10px;
    font-size: 13px; color: var(--accent); font-weight: 600;
  }
  .card.coming { opacity: .55; }
  .card.coming .go { color: var(--sub); }
  footer {
    padding: 24px 20px 0;
    font-size: 12px; color: var(--sub); text-align: center;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(3, 1fr); max-width: 720px; margin: 0 auto; }
    header { max-width: 720px; margin: 0 auto; }
  }
</style>
</head>
<body>
<header>
  <h1>工具箱</h1>
  <p>常用小工具，点开就能用</p>
</header>

<main class="grid">
  <a class="card" href="calculator.html">
    <div class="icon">🧮</div>
    <h2>计算器</h2>
    <p>加减乘除、百分比，手机上顺手算</p>
    <span class="go">打开 →</span>
  </a>

  <a class="card" href="reading.html">
    <div class="icon">📖</div>
    <h2>英语阅读</h2>
    <p>6 篇英文文章，左边读原文、右边看重点词，每段有翻译，点句同步高亮</p>
    <span class="go">打开 →</span>
  </a>

  <a class="card" href="markdown.html">
    <div class="icon">📄</div>
    <h2>墨读</h2>
    <p>Markdown 阅读器：打开 .md 文件，排成干净的纸页，目录、查找、主题、字号都在手边</p>
    <span class="go">打开 →</span>
  </a>

  <div class="card coming">
    <div class="icon">➕</div>
    <h2>更多工具</h2>
    <p>敬请期待，想到什么就加什么</p>
    <span class="go">即将上线</span>
  </div>
</main>

<footer>部署在 Abasthan · 可在 Telegram Mini App 里打开</footer>
</body>
</html>
